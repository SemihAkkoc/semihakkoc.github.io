name: Prettier code formatter

# Manual only, so it never pushes formatting commits on top of your own pushes.
on:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      # Give the action permission to write back to the repository
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          # Use head_ref for PRs, otherwise the default branch
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4

      - name: Install Prettier 💾
        run: npm install --save-dev --save-exact prettier @shopify/prettier-plugin-liquid

      - name: Prettier Write ✨
        # This fixes the files instead of just checking them
        run: npx prettier . --write

      - name: Commit changes 🚀
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: fix formatting with Prettier [skip ci]"