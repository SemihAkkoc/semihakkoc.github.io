cv:
  name: Mahmut Semih Akkoç
  label: Ph.D. Student in Electrical and Computer Engineering, University of Maryland
  email: akkoc@umd.edu
  location: College Park, MD, USA
  image: ""
  summary: >-
    Ph.D. student in Electrical and Computer Engineering at the University of Maryland, advised by
    Prof. Sennur Ulukus, working at the intersection of **information theory**, **data compression**,
    and the **interpretability of large language models**. My research establishes the fundamental
    limits of what can be discarded: deriving rate–distortion characterizations that govern task-aware
    compression, and analyzing transformers as tractable dynamical systems to locate where
    representational work actually happens.

