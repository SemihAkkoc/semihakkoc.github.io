    Research Experience:
      - company: University of Maryland, College Park
        position: Graduate Research Assistant
        summary: Information Theory & Machine Learning
        location: College Park, MD
        start_date: 2025-09
        end_date: present
        highlights:
          - Develop information-theoretic and dynamical-systems tools for compressing and interpreting transformer architectures, spanning task-aware rate allocation and mechanistic analysis of attention and feed-forward blocks; one conference paper accepted, one journal submission under review, and two manuscripts in preparation within the first year of the program.
          - Collaborate across four institutions (UMD, UW–Madison, Oxford, Ohio State) on the mathematical foundations of deep learning, translating abstract dynamical characterizations into empirically testable claims about model behavior.

      - company: Bilkent University
        position: Undergraduate Researcher
        summary: Semantic Signal Processing (Prof. Orhan Arıkan) · Computational Electromagnetics (Prof. Vakur B. Ertürk)
        location: Ankara, Türkiye
        start_date: 2023-02
        end_date: 2025-05
        highlights:
          - Built the embedded hardware demonstrator that turned the group's theoretical semantic signal processing framework into a working multi-sensor system, establishing the experimental basis for a journal publication.
          - Profiled semantic extraction under strict power and memory budgets on Raspberry Pi, quantifying the compute floor required for real-time goal-oriented inference at the edge.
          - Implemented a method-of-moments solver from first principles to model plane-wave scattering by a perfectly conducting strip, validating numerical results against analytical limits.

    Industry Experience:
      - company: ASELSAN
        position: Summer Intern
        summary: RF & Microwave Systems
        location: Ankara, Türkiye
        start_date: 2024-08
        end_date: 2024-09
        highlights:
          - Designed a suspended ring resonator model in MATLAB and CST Studio that estimates dielectric constant and loss tangent, delivering a low-cost alternative to commercial material characterization for antenna development.
          - Cross-validated MATLAB against full-wave CST simulations to bound estimation error, then generalized the method into a lookup table and polynomial fits so the tool transfers across materials without re-derivation.

      - company: Huawei
        position: R&D Intern
        summary: Semantic Communications
        location: Ankara, Türkiye
        start_date: 2023-06
        end_date: 2023-08
        highlights:
          - Prototyped a two-node semantic communication network on Raspberry Pi devices that performs visual semantic extraction entirely on-device, collapsing the transmission requirement from a 10 Mbps raw video stream to roughly 10 bps of task-relevant semantic tokens, a ~10⁵× reduction in bandwidth achieved by transmitting meaning rather than pixels.
          - Engineered the TCP-based transport layer and a stream fusion algorithm that merged asynchronous multi-sensor inputs, improving integration accuracy by 67.2% over unfused processing while operating within the power and memory envelope of embedded hardware.

      - company: BİTES Defence & Aerospace Technologies
        position: Summer Intern
        summary: Software Engineering
        location: Ankara, Türkiye
        start_date: 2022-06
        end_date: 2022-08
        highlights:
          - Built a multithreaded, socket-based file transfer system in C++ supporting arbitrary file types via binary-mode I/O, applying factory and observer patterns to keep socket creation and worker notification decoupled and extensible.

